<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FERAL OPS: City Assault</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
</head><body>
<div class="hud" id="mis"><b>ACTIVE CONTRACT</b><span id="mt"></span></div>
<div class="hud" id="st">HOSTILES <i id="hs"></i><br>CASH <i id="cash"></i><div id="stars"></div></div>
<div class="hud" id="vit"><div>HEALTH</div><div class="bar"><div id="hp" style="background:#e5383b"></div></div><div style="margin-top:6px">ARMOR</div><div class="bar"><div id="ar" style="background:var(--cy)"></div></div></div>
<div class="hud" id="ammo"><big id="am"></big><small id="gr"></small></div>
<canvas class="hud" id="mm" width="150" height="150"></canvas>
<div class="hud" id="cx"></div><div class="hud" id="hm"></div><div class="hud" id="toast"></div><div id="dmg"></div>
<div id="ov"><h1>FERAL <em>OPS</em></h1><p id="ovt">Take contracts, clear hostile crews, steal a ride and reach the extraction beacon. Do not get wasted.</p>
<p><code>WASD</code> move &middot; <code>Shift</code> sprint &middot; <code>Mouse</code> aim &middot; <code>Click</code> fire &middot; <code>R</code> reload &middot; <code>G</code> grenade &middot; <code>E</code> enter or exit car</p>
<button id="go">Deploy</button></div>
<script type="module" src="/src/main.js"></script>
</body></html>
